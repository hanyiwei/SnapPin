<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>区域截图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      cursor: crosshair;
      user-select: none;
      overflow: hidden;
      /* 背景图由 JS 注入，初始透明等待 */
      background-color: #000;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    /* 全屏暗色遮罩，铺在截图上方 */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }

    /* 选区方框 */
    #selection {
      position: absolute;
      border: 2px solid #cba6f7;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.45);
      display: none;
      pointer-events: none;
    }

    /* 尺寸提示 */
    #size-hint {
      position: absolute;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      pointer-events: none;
      display: none;
      font-family: monospace;
      white-space: nowrap;
    }

    #tip {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.85);
      font-size: 13px;
      font-family: -apple-system, sans-serif;
      pointer-events: none;
      background: rgba(0,0,0,0.55);
      padding: 5px 14px;
      border-radius: 6px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="overlay"></div>
  <div id="selection"></div>
  <div id="size-hint"></div>
  <div id="tip">拖动选择截图区域 &nbsp;·&nbsp; 松开 / Enter 确认 &nbsp;·&nbsp; Esc 取消</div>

  <script>
    const sel = document.getElementById('selection');
    const hint = document.getElementById('size-hint');
    let sx = 0, sy = 0, dragging = false;
    let capturedDataUrl = null;

    // 接收 display 信息 → 由渲染进程调用 desktopCapturer（可触发 macOS 权限弹框）
    window.snappin.onCaptureDisplayInfo(async ({ displayId, width, height }) => {
      try {
        capturedDataUrl = await window.snappin.captureScreenForDisplay(displayId, width, height);
      } catch (e) {
        capturedDataUrl = null;
      }
      if (capturedDataUrl) {
        const img = new Image();
        img.onload = () => {
          document.body.style.backgroundImage = `url("${capturedDataUrl}")`;
          window.snappin.captureReady();
        };
        img.onerror = () => window.snappin.captureReady();
        img.src = capturedDataUrl;
      } else {
        window.snappin.captureReady();
      }
    });

    document.addEventListener('mousedown', (e) => {
      sx = e.clientX; sy = e.clientY;
      dragging = true;
      document.getElementById('overlay').style.display = 'none';
      sel.style.display = 'block';
      hint.style.display = 'block';
      updateSel(e.clientX, e.clientY);
    });

    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      updateSel(e.clientX, e.clientY);
    });

    document.addEventListener('mouseup', (e) => {
      if (!dragging) return;
      dragging = false;
      sendResult(e.clientX, e.clientY);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.snappin.captureCancel();
      if (e.key === 'Enter' && !dragging) sendResult(sx, sy);
    });

    function updateSel(cx, cy) {
      const x = Math.min(sx, cx), y = Math.min(sy, cy);
      const w = Math.abs(cx - sx), h = Math.abs(cy - sy);
      sel.style.left = x + 'px';
      sel.style.top  = y + 'px';
      sel.style.width  = w + 'px';
      sel.style.height = h + 'px';
      hint.textContent = `${w} × ${h}`;
      hint.style.left = (x + w + 8) + 'px';
      hint.style.top  = Math.max(0, y - 20) + 'px';
    }

    function sendResult(ex, ey) {
      const x = Math.min(sx, ex), y = Math.min(sy, ey);
      const w = Math.abs(ex - sx), h = Math.abs(ey - sy);
      if (w < 4 || h < 4) { window.snappin.captureCancel(); return; }

      if (!capturedDataUrl) {
        window.snappin.captureCancel();
        return;
      }

      // 用 Canvas 在渲染进程裁剪，避免向主进程传输整张截图
      const img = new Image();
      img.onload = () => {
        const scaleX = img.naturalWidth  / window.innerWidth;
        const scaleY = img.naturalHeight / window.innerHeight;
        const canvas = document.createElement('canvas');
        canvas.width  = Math.max(1, Math.round(w * scaleX));
        canvas.height = Math.max(1, Math.round(h * scaleY));
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,
          Math.round(x * scaleX), Math.round(y * scaleY),
          canvas.width, canvas.height,
          0, 0, canvas.width, canvas.height
        );
        window.snappin.captureDoneWithImage({
          rect: { x, y, width: w, height: h },
          imgDataUrl: canvas.toDataURL('image/png')
        });
      };
      img.src = capturedDataUrl;
    }
  </script>
</body>
</html>
