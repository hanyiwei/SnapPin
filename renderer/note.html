<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>文本贴</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #note-wrap {
      width: 100%; height: 100%;
      background: #fffef5;
      box-shadow: inset 0 0 0 2px rgba(203, 166, 247, 0.85);
      display: flex;
      flex-direction: column;
    }

    /*
     * 顶部不可见拖拽条（20px）
     * ─ 负责：拖动窗口 + 双击关闭
     * ─ 视觉上与内容区无差别，用户不会察觉
     * ─ hover 时显示极淡的拖拽提示（可选）
     */
    #drag-handle {
      flex-shrink: 0;
      height: 20px;
      cursor: grab;
      position: relative;
    }
    #drag-handle:active { cursor: grabbing; }
    /* hover 时中央出现隐约点状提示，帮助用户发现可拖 */
    #drag-handle::after {
      content: '· · ·';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      letter-spacing: 3px;
      color: rgba(203, 166, 247, 0.35);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    #drag-handle:hover::after { opacity: 1; }

    /*
     * 文字内容区
     * ─ 负责：文字展示 + 鼠标选中复制
     * ─ 与拖拽条完全隔离，无任何冲突
     */
    #note-content {
      flex: 1;
      padding: 2px 12px 10px;
      font-size: 14px;
      line-height: 1.72;
      color: #2a2a2a;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-y: auto;
      cursor: text;
      /* 文字可选 */
      user-select: text;
      -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <div id="note-wrap">
    <div id="drag-handle"></div>
    <div id="note-content"></div>
  </div>

  <script>
    let winId = null;
    const dragHandle  = document.getElementById('drag-handle');
    const noteContent = document.getElementById('note-content');

    window.snappin.onInitNote(({ id, text }) => {
      winId = id;
      noteContent.textContent = text || '';
    });

    // ── 拖动（仅限顶部拖拽条）────────────────────────────────
    let dragging = false, lastX = 0, lastY = 0, movePending = false;

    dragHandle.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      lastX = e.screenX;
      lastY = e.screenY;
      e.preventDefault(); // 防止文字误选
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging || movePending) return;
      movePending = true;
      requestAnimationFrame(() => {
        const dx = e.screenX - lastX;
        const dy = e.screenY - lastY;
        lastX = e.screenX;
        lastY = e.screenY;
        if (dx !== 0 || dy !== 0) window.snappin.nudgeWin(winId, dx, dy);
        movePending = false;
      });
    });

    window.addEventListener('mouseup', () => { dragging = false; });

    // ── 双击关闭（仅限顶部拖拽条）────────────────────────────
    dragHandle.addEventListener('dblclick', () => {
      window.snappin.closeWin(winId);
    });
  </script>
</body>
</html>
