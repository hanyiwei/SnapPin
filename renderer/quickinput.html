<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>快速输入</title>
  <link rel="stylesheet" href="float.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: transparent;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quickinput-wrap {
      width: 100%;
      padding: 12px 14px;
    }
  </style>
</head>
<body>
  <div class="quickinput-wrap">
    <input type="text" id="qi-input" placeholder="输入便签内容，Enter 确认…" autofocus>
    <div class="quickinput-hint">Enter 确认 · Esc 取消</div>
  </div>
  <script>
    const input = document.getElementById('qi-input');
    input.focus();

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        window.snappin.quickInputConfirm(input.value);
      } else if (e.key === 'Escape') {
        window.snappin.quickInputCancel();
      }
    });
  </script>
</body>
</html>
