<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>截图</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── 图片区 ──────────────────────────────────────────────── */
    #img-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      cursor: grab;
      /* 描边：inset box-shadow 不占空间，不影响布局 */
      box-shadow: inset 0 0 0 2px rgba(203, 166, 247, 0.85);
    }
    #img-wrap:active { cursor: grabbing; }

    #shot {
      width: 100%; height: 100%;
      object-fit: fill;
      display: block;
      pointer-events: none; /* 拖动交互由父元素统一处理 */
    }

    /* ── OCR 触发按钮（hover 时显示在右下角）─────────────────── */
    #btn-text {
      position: absolute;
      bottom: 8px; right: 8px;
      width: 26px; height: 26px;
      border-radius: 50%;
      border: 1px solid rgba(203,166,247,0.5);
      background: rgba(20, 20, 34, 0.82);
      color: #cba6f7;
      font-size: 12px;
      font-family: -apple-system, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 默认完全透明不可点 */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s, background 0.15s;
      backdrop-filter: blur(4px);
    }
    /* 仅当 OCR 有文字且鼠标悬停时才显示 */
    body.has-text #img-wrap:hover #btn-text {
      opacity: 1;
      pointer-events: auto;
    }
    #btn-text:hover {
      transform: scale(1.12);
      background: rgba(203,166,247,0.9);
      color: #1e1e2e;
    }

    /* ── 文字展示区（点击按钮后追加在图片下方）────────────────── */
    #text-panel {
      flex-shrink: 0;
      height: 150px;
      overflow-y: auto;
      background: #ffffff;
      padding: 8px 10px;
      font-size: 13px;
      line-height: 1.65;
      color: #333;
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
      -webkit-user-select: text;
      border-top: 1px solid rgba(203,166,247,0.4);
      box-shadow: inset 0 0 0 2px rgba(203,166,247,0.85);
    }
  </style>
</head>
<body>
  <div id="img-wrap">
    <img id="shot" src="" alt="" draggable="false">
    <button id="btn-text" title="展示识别文字">文</button>
  </div>
  <div id="text-panel" hidden></div>

  <script>
    let winId = null;
    let ocrText = '';
    let textExpanded = false;
    const TEXT_H = 150;

    const imgWrap  = document.getElementById('img-wrap');
    const shot     = document.getElementById('shot');
    const btnText  = document.getElementById('btn-text');
    const textPanel = document.getElementById('text-panel');

    // ── 初始化 ────────────────────────────────────────────────
    window.snappin.onInitScreenshot(({ id, imgPath }) => {
      winId = id;
      shot.src = 'file://' + imgPath;
      runOCR(imgPath);
    });

    // ── 静默 OCR ──────────────────────────────────────────────
    function runOCR(imgPath) {
      const worker = new Worker('ocr.worker.js');
      worker.postMessage({ imgPath: 'file://' + imgPath });
      worker.onmessage = ({ data }) => {
        if (data.type === 'result' && data.text && data.text.trim()) {
          ocrText = data.text.trim();
          textPanel.textContent = ocrText;
          // 有文字才给 body 加标记，按钮才会在 hover 时出现
          document.body.classList.add('has-text');
        }
        worker.terminate();
      };
      worker.onerror = () => worker.terminate();
    }

    // ── 拖动（增量 IPC）──────────────────────────────────────
    let dragging = false;
    let lastX = 0, lastY = 0;
    let movePending = false;

    imgWrap.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      dragging = true;
      lastX = e.screenX;
      lastY = e.screenY;
      e.preventDefault();
    });

    window.addEventListener('mousemove', (e) => {
      if (!dragging || movePending) return;
      movePending = true;
      requestAnimationFrame(() => {
        const dx = e.screenX - lastX;
        const dy = e.screenY - lastY;
        lastX = e.screenX;
        lastY = e.screenY;
        if (dx !== 0 || dy !== 0) window.snappin.nudgeWin(winId, dx, dy);
        movePending = false;
      });
    });

    window.addEventListener('mouseup', () => { dragging = false; });

    // ── 双击关闭 ─────────────────────────────────────────────
    imgWrap.addEventListener('dblclick', () => window.snappin.closeWin(winId));

    // ── 滚轮等比缩放 ─────────────────────────────────────────
    let zoomPending = false;
    imgWrap.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (zoomPending) return;
      zoomPending = true;
      requestAnimationFrame(() => {
        // deltaY < 0 = 向上滚 = 放大
        window.snappin.zoomWin(winId, e.deltaY < 0 ? 40 : -40);
        zoomPending = false;
      });
    }, { passive: false });

    // ── OCR 按钮：展开 / 收起文字区 ──────────────────────────
    btnText.addEventListener('mousedown', (e) => e.stopPropagation()); // 防止触发拖动
    btnText.addEventListener('dblclick',  (e) => e.stopPropagation()); // 防止触发关闭
    btnText.addEventListener('click', (e) => {
      e.stopPropagation();
      textExpanded = !textExpanded;
      if (textExpanded) {
        textPanel.removeAttribute('hidden');
        window.snappin.expandTextArea(winId, TEXT_H);
        btnText.title = '收起文字';
        btnText.textContent = '×';
      } else {
        textPanel.setAttribute('hidden', '');
        window.snappin.expandTextArea(winId, -TEXT_H);
        btnText.title = '展示识别文字';
        btnText.textContent = '文';
      }
    });
  </script>
</body>
</html>
