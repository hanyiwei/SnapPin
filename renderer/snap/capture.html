<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body { background: rgba(0,0,0,0.35); user-select: none; cursor: crosshair; }
  #sel {
    position: absolute;
    border: 2px dashed #fff;
    background: transparent;
    display: none;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
  }
</style>
</head>
<body>
<div id="sel"></div>
<script>
  const { ipcRenderer } = require('electron');
  const sel = document.getElementById('sel');
  let startX = 0, startY = 0;

  ipcRenderer.send('capture:ready');

  document.addEventListener('mousedown', (e) => {
    startX = e.clientX;
    startY = e.clientY;
    sel.style.left = startX + 'px';
    sel.style.top = startY + 'px';
    sel.style.width = '0px';
    sel.style.height = '0px';
    sel.style.display = 'block';
  });

  document.addEventListener('mousemove', (e) => {
    if (sel.style.display !== 'block') return;
    const x = Math.min(startX, e.clientX);
    const y = Math.min(startY, e.clientY);
    const w = Math.abs(e.clientX - startX);
    const h = Math.abs(e.clientY - startY);
    sel.style.left = x + 'px';
    sel.style.top = y + 'px';
    sel.style.width = w + 'px';
    sel.style.height = h + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (sel.style.display !== 'block') return;
    sel.style.display = 'none';
    const rect = {
      x: parseInt(sel.style.left),
      y: parseInt(sel.style.top),
      width: parseInt(sel.style.width),
      height: parseInt(sel.style.height)
    };
    if (rect.width < 10 || rect.height < 10) {
      ipcRenderer.send('capture:cancel');
      return;
    }
    // 只发 rect，截图由主进程用 screenshot-desktop 完成
    ipcRenderer.send('capture:done', { rect });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') ipcRenderer.send('capture:cancel');
  });
</script>
</body>
</html>
