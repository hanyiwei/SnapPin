<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: #f5f5f5;
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    font-size: 13px;
    padding: 8px;
  }
  h3 { font-size: 14px; margin-bottom: 8px; color: #333; }
  .btn-row { display: flex; gap: 6px; margin-bottom: 10px; }
  button {
    flex: 1; padding: 6px 0; border: 1px solid #ddd;
    background: #fff; border-radius: 4px; cursor: pointer;
    font-size: 12px; color: #333;
  }
  button:hover { background: #e8e8e8; }
  #list { max-height: 360px; overflow-y: auto; }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 8px; background: #fff; margin-bottom: 4px;
    border-radius: 4px; border: 1px solid #eee;
  }
  .item .label { color: #555; }
  .item .actions { display: flex; gap: 4px; }
  .item .actions button { padding: 2px 8px; font-size: 11px; }
</style>
</head>
<body>
<h3>SnapPin 便签坞</h3>
<div class="btn-row">
  <button onclick="window.snappin.createNote()">+ 文本贴</button>
  <button onclick="window.snappin.startSnapCapture()">+ 截图贴</button>
</div>
<div class="btn-row">
  <button onclick="window.snappin.hideAllWindows()">全部隐藏</button>
  <button onclick="window.snappin.showAllWindows()">全部显示</button>
</div>
<div id="list"></div>
<script>
  async function refresh() {
    const wins = await window.snappin.getWindowsList();
    const list = document.getElementById('list');
    list.innerHTML = wins.map(w =>
      `<div class="item">
        <span class="label">${w.type === 'snap' ? '🖼 截图贴' : '📝 文本贴'} #${w.id}</span>
        <span class="actions">
          <button onclick="window.snappin.dockShowWin(${w.id})">显示</button>
          <button onclick="window.snappin.dockHideWin(${w.id})">隐藏</button>
        </span>
      </div>`
    ).join('');
  }
  refresh();
  setInterval(refresh, 2000);
</script>
</body>
</html>
